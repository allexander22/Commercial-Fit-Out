<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="A2 Commercial Fit Out">
  <defs>
    <linearGradient id="sq-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3f5f7"/>
      <stop offset="55%" stop-color="#c6ccd3"/>
      <stop offset="100%" stop-color="#8b929b"/>
    </linearGradient>
    <linearGradient id="sq-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#57a0ec"/>
      <stop offset="100%" stop-color="#1c4f8a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="#0b0d10"/>

  <!-- A2 monogram -->
  <text x="140" y="230" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-weight="900" font-size="130" fill="url(#sq-silver)">A</text>
  <text x="240" y="230" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-weight="900" font-size="130" fill="url(#sq-blue)">2</text>
  <path d="M 100 260 Q 200 285 300 260" fill="none" stroke="url(#sq-blue)" stroke-width="4" stroke-linecap="round" opacity="0.65"/>

  <!-- Wordmark -->
  <text x="200" y="305" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-weight="800" font-size="34" letter-spacing="3" fill="#e4e7eb">COMMERCIAL</text>
  <line x1="120" y1="333" x2="150" y2="333" stroke="url(#sq-blue)" stroke-width="2.5"/>
  <text x="200" y="342" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-weight="700" font-size="24" letter-spacing="6" fill="url(#sq-blue)">FIT OUT</text>
  <line x1="250" y1="333" x2="280" y2="333" stroke="url(#sq-blue)" stroke-width="2.5"/>
</svg>
